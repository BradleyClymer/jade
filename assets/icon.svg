<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jade">
  <defs>
    <radialGradient id="jadeTable" cx="0.4" cy="0.33" r="0.9">
      <stop offset="0" stop-color="#9fd0ad"/>
      <stop offset="0.5" stop-color="#579a73"/>
      <stop offset="1" stop-color="#3c835d"/>
    </radialGradient>
  </defs>

  <!-- gem only, centered and enlarged -->
  <g transform="translate(256,256) scale(1.62) translate(-298.5,-212.5)">
    <g stroke="#214c36" stroke-width="1" stroke-linejoin="round" stroke-opacity="0.3">
      <!-- crown facets: lit upper-left, shaded lower-right -->
      <polygon points="300,95 372,120 338,163 300,150" fill="#7cb98e"/>
      <polygon points="372,120 415,200 358,203 338,163" fill="#4f9169"/>
      <polygon points="415,200 395,285 348,245 358,203" fill="#3f7d5a"/>
      <polygon points="395,285 315,330 307,268 348,245" fill="#2f6a4a"/>
      <polygon points="315,330 220,315 260,260 307,268" fill="#4a8c66"/>
      <polygon points="220,315 182,225 241,215 260,260" fill="#5ea075"/>
      <polygon points="182,225 215,135 258,170 241,215" fill="#6fae82"/>
      <polygon points="215,135 300,95 300,150 258,170" fill="#9cc9a9"/>
      <!-- table -->
      <polygon points="300,150 338,163 358,203 348,245 307,268 260,260 241,215 258,170" fill="url(#jadeTable)"/>
    </g>

    <!-- soft internal cloud for a stony, waxy depth -->
    <ellipse cx="296" cy="212" rx="34" ry="24" fill="#bfe0c9" opacity="0.18"/>

    <!-- outer girdle edge -->
    <polygon points="300,95 372,120 415,200 395,285 315,330 220,315 182,225 215,135"
             fill="none" stroke="#1b4330" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>

    <!-- gentle matte sheen (no glassy glare) -->
    <polygon points="258,170 300,150 285,206 247,210" fill="#ffffff" opacity="0.16"/>
    <polygon points="215,135 300,95 300,150 258,170" fill="#ffffff" opacity="0.07"/>
  </g>
</svg>
