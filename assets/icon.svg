<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#166534" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0d1a0d"/>
  <!-- Jade gemstone shape -->
  <polygon points="128,32 200,80 200,176 128,224 56,176 56,80" fill="url(#gem)" stroke="#4ade80" stroke-width="2"/>
  <!-- Facet lines -->
  <line x1="128" y1="32" x2="128" y2="224" stroke="#86efac" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="56" y1="80" x2="200" y2="176" stroke="#86efac" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="200" y1="80" x2="56" y2="176" stroke="#86efac" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- Center highlight -->
  <polygon points="128,80 160,108 160,148 128,176 96,148 96,108" fill="url(#facet)"/>
  <!-- J letter -->
  <text x="128" y="145" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0d1a0d" text-anchor="middle" opacity="0.5">J</text>
</svg>
