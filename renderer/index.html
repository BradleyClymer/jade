<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jade</title>
  <link rel="stylesheet" href="../dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="tab-bar">
    <div id="tabs"></div>
    <button id="new-tab-btn" title="New Tab">+</button>
  </div>
  <div id="toolbar">
    <button class="tb-btn" data-action="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button class="tb-btn" data-action="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button class="tb-btn" data-action="strikethrough" title="Strikethrough"><s>S</s></button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-action="h1" title="Heading 1">H1</button>
    <button class="tb-btn" data-action="h2" title="Heading 2">H2</button>
    <button class="tb-btn" data-action="h3" title="Heading 3">H3</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-action="ul" title="Bullet List">&#8226; List</button>
    <button class="tb-btn" data-action="ol" title="Numbered List">1. List</button>
    <button class="tb-btn" data-action="task" title="Task List">&#9744; Task</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-action="link" title="Insert Link">&#128279;</button>
    <button class="tb-btn" data-action="image" title="Insert Image">&#128247;</button>
    <button class="tb-btn" data-action="code" title="Inline Code">&lt;/&gt;</button>
    <button class="tb-btn" data-action="codeblock" title="Code Block">&#9635; Code</button>
    <span class="tb-sep"></span>
    <button class="tb-btn" data-action="blockquote" title="Blockquote">&#10073; Quote</button>
    <button class="tb-btn" data-action="hr" title="Horizontal Rule">&#8212;</button>
    <button class="tb-btn" data-action="table" title="Insert Table">&#9638; Table</button>
  </div>
  <div id="workspace">
    <div id="outline-panel" class="outline-hidden">
      <div id="outline-header"><span>Outline</span><button id="outline-close">&times;</button></div>
      <div id="outline-content"></div>
    </div>
    <div id="git-panel" class="git-hidden">
      <div id="git-header"><span>Git</span><button id="git-close">&times;</button></div>
      <div id="git-content"></div>
    </div>
    <div id="collab-panel" class="collab-hidden">
      <div id="collab-header"><span>Collaborate</span><button id="collab-close">&times;</button></div>
      <div id="collab-content"></div>
    </div>
    <div id="editor-pane">
      <div id="minimap" class="minimap-hidden">
        <canvas id="minimap-canvas"></canvas>
        <div id="minimap-viewport"></div>
      </div>
    </div>
    <div id="divider"></div>
    <div id="preview-pane">
      <div id="preview-content"></div>
    </div>
  </div>
  <div id="status-bar">
    <span id="status-file">Untitled</span>
    <span id="status-cursor">Ln 1, Col 1</span>
    <span id="status-words">0 words</span>
    <span id="status-encoding" class="status-btn" title="Encoding (click to change)">UTF-8</span>
    <span id="status-eol" class="status-btn" title="Line ending (click to toggle)">LF</span>
    <span id="status-lang">Markdown</span>
    <button id="macro-btn" class="status-btn" title="Macro (Ctrl+Shift+R to record, Ctrl+Shift+P to play)">Macro</button>
    <button id="collab-btn" class="status-btn" title="Collaborate">Collab</button>
    <button id="minimap-btn" class="status-btn" title="Minimap">Map</button>
    <button id="outline-btn" class="status-btn" title="Document outline (Ctrl+Shift+O)">Outline</button>
    <button id="lint-btn" class="status-btn" title="Markdown lint (off)">Lint</button>
    <button id="spell-btn" class="status-btn" title="Spell check (off)">Spell</button>
    <button id="wrap-btn" class="status-btn active" title="Word wrap (on)">Wrap</button>
    <button id="theme-btn" class="status-btn" title="Theme">Jade</button>
    <button id="scroll-lock-btn" class="status-btn active" title="Scroll sync (on)">&#128274;</button>
    <button id="vim-mode-btn" class="status-btn" title="Vim mode (off)">VIM</button>
  </div>
  <script src="../dist/bundle.js"></script>
</body>
</html>
